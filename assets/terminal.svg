<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" role="img" aria-label="Terminal: whoami, stack, deploy">
  <style>
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; }
    .prompt { fill: #7C3AED; }
    .cmd    { fill: #E6EDF3; }
    .out    { fill: #8B949E; }
    .ok     { fill: #3FB950; }
    .dim    { fill: #6E7681; font-size: 12px; }

    .type { transform: scaleX(0); animation: type 0.7s steps(24) forwards; }
    @keyframes type { to { transform: scaleX(1); } }

    .cur { animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .l1 { animation-delay: 0.5s;  transform-origin: 26px 0; }
    .l2 { animation-delay: 1.35s; transform-origin: 26px 0; }
    .l3 { animation-delay: 2.2s;  transform-origin: 26px 0; }
    .l4 { animation-delay: 3.05s; transform-origin: 26px 0; }
    .l5 { animation-delay: 3.9s;  transform-origin: 26px 0; }
    .l6 { animation-delay: 4.75s; transform-origin: 26px 0; }
    .l7 { animation-delay: 5.6s;  transform-origin: 26px 0; }

    @media (prefers-reduced-motion: reduce) {
      .type { animation: none; transform: scaleX(1); }
      .cur  { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="698" height="328" rx="10" fill="#0D1117" stroke="#30363D"/>
  <path d="M1 11a10 10 0 0 1 10-10h678a10 10 0 0 1 10 10v28H1z" fill="#161B22"/>
  <line x1="1" y1="39" x2="699" y2="39" stroke="#30363D"/>
  <circle cx="24" cy="20" r="6" fill="#FF5F57"/>
  <circle cx="44" cy="20" r="6" fill="#FEBC2E"/>
  <circle cx="64" cy="20" r="6" fill="#28C840"/>
  <text x="350" y="25" class="mono dim" text-anchor="middle">akhil@brynk — zsh</text>

  <clipPath id="c1"><rect class="type l1" x="26" y="52" width="640" height="24"/></clipPath>
  <g clip-path="url(#c1)">
    <text x="26" y="72" class="mono"><tspan class="prompt">➜ </tspan><tspan class="cmd">whoami</tspan></text>
  </g>

  <clipPath id="c2"><rect class="type l2" x="26" y="80" width="640" height="24"/></clipPath>
  <g clip-path="url(#c2)">
    <text x="26" y="100" class="mono out">akhil mulagada · full-stack engineer</text>
  </g>

  <clipPath id="c3"><rect class="type l3" x="26" y="115" width="640" height="24"/></clipPath>
  <g clip-path="url(#c3)">
    <text x="26" y="135" class="mono"><tspan class="prompt">➜ </tspan><tspan class="cmd">cat stack.txt</tspan></text>
  </g>

  <clipPath id="c4"><rect class="type l4" x="26" y="143" width="640" height="24"/></clipPath>
  <g clip-path="url(#c4)">
    <text x="26" y="163" class="mono out">django · fastapi · react · aws</text>
  </g>

  <clipPath id="c5"><rect class="type l5" x="26" y="178" width="640" height="24"/></clipPath>
  <g clip-path="url(#c5)">
    <text x="26" y="198" class="mono"><tspan class="prompt">➜ </tspan><tspan class="cmd">./deploy --prod</tspan></text>
  </g>

  <clipPath id="c6"><rect class="type l6" x="26" y="206" width="640" height="24"/></clipPath>
  <g clip-path="url(#c6)">
    <text x="26" y="226" class="mono out">building ▸▸▸▸▸▸▸▸▸▸ <tspan class="ok">done</tspan></text>
  </g>

  <clipPath id="c7"><rect class="type l7" x="26" y="234" width="640" height="24"/></clipPath>
  <g clip-path="url(#c7)">
    <text x="26" y="254" class="mono out">shipped to production <tspan class="ok">✔</tspan></text>
  </g>

  <text x="26" y="290" class="mono"><tspan class="prompt">➜ </tspan><tspan class="cur cmd">▋</tspan></text>
</svg>
