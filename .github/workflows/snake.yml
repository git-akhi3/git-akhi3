name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%237C3AED&color_dots=%23ede9fe,%23c4b5fd,%239a76f0,%237C3AED,%235b21b6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%237C3AED&color_dots=%23161b22,%233c2a6e,%235b21b6,%237C3AED,%23a78bfa

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
