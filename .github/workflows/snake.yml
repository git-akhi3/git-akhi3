name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%232CC9E4&color_dots=%23e0fbff,%23a5edfa,%235fd9ee,%232CC9E4,%230e7f96
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%232CC9E4&color_dots=%23161b22,%230e4d5c,%231a8ba6,%232CC9E4,%237ee8f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
